<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Unit Conversion</title>
  </head>
  <body>
    <main id="main">
      <div class="container-unit">
        <h1>Metric/Imperial Unit Conversion</h1>
        <form class="conversion-form">
          <label for="input-number">Value to convert</label>
          <input
            type="number"
            id="input-number"
            inputmode="decimal"
            step="any"
            aria-describedby="status-message"
            required
          />
          <button type="submit" id="btn-convert">Convert</button>
        </form>
        <p id="status-message" class="status-message" role="alert"></p>
      </div>
      <div class="container-result hidden" aria-live="polite">
        <div class="box">
          <h3>Length (Meter/Feet)</h3>
          <p class="length"></p>
        </div>
        <div class="box">
          <h3>Volume (Liters/Gallons)</h3>
          <p class="volume"></p>
        </div>
        <div class="box">
          <h3>Mass (Kilograms/Pounds)</h3>
          <p class="mass"></p>
        </div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
